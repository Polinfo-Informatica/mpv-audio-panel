# Capability-aware video playback profiles.
# Applied last, and latched only after sustained playback drops for this track.
[VIDEO_LOW_POWER]
profile-cond=get("user-data/video-safety/low_power", false)
profile-restore=copy-equal
hdr-compute-peak=no
hdr-contrast-recovery=0
deband=no
interpolation=no

[HDR_OFF]
profile-cond=get("user-data/video-safety/sdr", false)
profile-restore=copy-equal
fullscreen=yes
tone-mapping=auto

[HDR_ON]
# HDR source + gpu-next + reporting context + negotiated HDR output.
profile-cond=get("user-data/video-safety/hdr_output", false)
profile-restore=copy-equal
fullscreen=yes

[HDR_TONEMAP]
# Compatible conversion when HDR output is SDR or cannot be confirmed.
profile-cond=get("user-data/video-safety/hdr_tonemap", false)
profile-restore=copy-equal
fullscreen=yes
tone-mapping=auto

[auto-hdr-generic]
profile-cond=get("user-data/video-safety/generic_hdr", false)
profile-restore=copy-equal
fullscreen=yes
# Let the renderer check compute-shader support instead of forcing it on.
hdr-compute-peak=auto

[DOLBY_VISION_TONEMAP]
# Decoded Dolby Vision color representation, not just a container profile tag.
# This processes metadata internally; it does not signal native Dolby Vision.
profile-cond=get("user-data/video-safety/dolby_vision", false)
profile-restore=copy-equal
fullscreen=yes
tone-mapping=auto
hdr-compute-peak=auto

[HDR10PLUS_TONEMAP]
# Valid decoded PQ scene metadata + gpu-next + an actual target.
# HDR10+ display certification is not required for conversion to SDR/HDR10.
profile-cond=get("user-data/video-safety/hdr10plus", false)
profile-restore=copy-equal
fullscreen=yes
tone-mapping=st2094-40
hdr-compute-peak=no

# Keep the broad base last so it evaluates before the specialized overlays.
[VIDEO_FALLBACK]
title=${media-title}
cursor-autohide=1000
autocreate-playlist=same
keep-open=yes
save-position-on-quit=yes
sub-auto=fuzzy
# Decoded real video only; still images and album art are excluded.
profile-cond=get("user-data/video-safety/video", false)
profile-restore=copy-equal
fullscreen=yes
border=no
title-bar=yes
force-window=immediate
window-maximized=no
keepaspect-window=yes
auto-window-resize=yes
osc=yes
input-builtin-dragging=yes
# Respect the negotiated output; never force a display mode or signal format.
target-colorspace-hint=auto
target-colorspace-hint-mode=target
target-colorspace-hint-strict=yes
target-trc=auto
target-prim=auto
target-gamut=auto
target-peak=auto
target-contrast=auto
gamut-mapping-mode=auto
tone-mapping=auto
hdr-compute-peak=auto
# Avoid adding expensive contrast and histogram refinement by default.
hdr-contrast-recovery=0
hdr-peak-percentile=100

# Protocol profiles apply to both audio and video streams.
[protocol.http]
hls-bitrate=max
cache=yes
cache-pause=no

[protocol.https]
profile=protocol.http

[protocol.ytdl]
profile=protocol.http
