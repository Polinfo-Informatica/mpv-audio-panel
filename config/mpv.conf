# Shared preferences are bootstrapped once; playback modes live in profiles.
[MPV_COMMON]
msg-color=yes
term-osd-bar=yes
force-window=immediate
cursor-autohide=1000
title=${media-title}
sub-auto=fuzzy
force-seekable=yes
autocreate-playlist=same
keep-open=yes
save-position-on-quit=yes


[default]
profile=MPV_COMMON

[AUTO_MUSIC]
# audio-panel.lua applies/restores this profile; do not add profile-cond.
# Restore only unchanged values, respecting later video-profile overrides.
profile-restore=copy-equal
fullscreen=no
force-window=yes

# Keep native Windows sizing and Snap without the standard title bar.
border=yes
title-bar=no
window-maximized=no
geometry=840x380
keepaspect-window=no
auto-window-resize=no

# Covers must not request changes to the monitor's output color space.
target-colorspace-hint=no

# Use the custom panel instead of the built-in controller and text playlist.
osc=no
osd-level=0
osd-msg1=
osd-msg2=
osd-msg3=
osd-playing-msg=
osd-bar=no
input-builtin-dragging=no

# The script keeps this profile active between consecutive audio files.

[AUDIO_PLAYBACK]
# The script applies these options file-locally, so they cannot affect video.
start=0
resume-playback=no
save-position-on-quit=no

[HDR_OFF]
# Neutral SDR settings; the fallback also covers unknown video formats.
profile-cond=get("current-tracks/video") ~= nil and not get("current-tracks/video/image", false) and not get("current-tracks/video/albumart", false) and p["video-params/gamma"] ~= "pq" and p["video-params/gamma"] ~= "hlg" and get("current-tracks/video/dolby-vision-profile", 0) ~= 5 and get("current-tracks/video/dolby-vision-profile", 0) ~= 8 and get("current-tracks/video/dolby-vision-profile", 0) ~= 9
profile-restore=copy-equal
fullscreen=yes
target-colorspace-hint=no
target-trc=auto
target-prim=auto
target-peak=auto
target-contrast=auto
gamut-mapping-mode=auto
hdr-compute-peak=auto
tone-mapping=auto

[HDR_ON]
profile-cond=get("current-tracks/video") ~= nil and not get("current-tracks/video/image", false) and not get("current-tracks/video/albumart", false) and (p["video-params/gamma"] == "pq" or p["video-params/gamma"] == "hlg")
profile-restore=copy-equal
fullscreen=yes
target-colorspace-hint=auto
# Display parameters stay automatic; tune HDR only for a calibrated display.
target-colorspace-hint-mode=target
target-trc=auto
target-prim=auto
target-gamut=auto
target-peak=auto
target-contrast=auto
gamut-mapping-mode=perceptual
hdr-peak-percentile=99.995
hdr-contrast-recovery=0.30

[auto-hdr-generic]
profile-cond=get("current-tracks/video") ~= nil and not get("current-tracks/video/image", false) and not get("current-tracks/video/albumart", false) and (p["video-params/gamma"] == "pq" or p["video-params/gamma"] == "hlg") and get("video-params/scene-max-r", 0) <= 0 and get("video-params/scene-max-g", 0) <= 0 and get("video-params/scene-max-b", 0) <= 0 and get("current-tracks/video/dolby-vision-profile", 0) ~= 5 and get("current-tracks/video/dolby-vision-profile", 0) ~= 8 and get("current-tracks/video/dolby-vision-profile", 0) ~= 9
profile-restore=copy-equal
fullscreen=yes
hdr-compute-peak=yes

[auto-dolby-vision-rpu]
profile-cond=get("current-tracks/video") ~= nil and not get("current-tracks/video/image", false) and not get("current-tracks/video/albumart", false) and (get("current-tracks/video/dolby-vision-profile", 0) == 5 or get("current-tracks/video/dolby-vision-profile", 0) == 8 or get("current-tracks/video/dolby-vision-profile", 0) == 9)
profile-restore=copy-equal
fullscreen=yes
hdr-compute-peak=no

[auto-hdr10plus]
profile-cond=get("current-tracks/video") ~= nil and not get("current-tracks/video/image", false) and not get("current-tracks/video/albumart", false) and (get("video-params/scene-max-r", 0) > 0 or get("video-params/scene-max-g", 0) > 0 or get("video-params/scene-max-b", 0) > 0)
profile-restore=copy-equal
fullscreen=yes
tone-mapping=st2094-40
hdr-compute-peak=no

# Keep the base last so this mpv build evaluates it before the HDR overlays.
[VIDEO_FALLBACK]
# Every real video uses this base, including silent and unclassified videos.
# Still images and album covers must never activate video playback profiles.
profile-cond=get("current-tracks/video") ~= nil and not get("current-tracks/video/image", false) and not get("current-tracks/video/albumart", false)
profile-restore=copy-equal
fullscreen=yes
border=no
title-bar=yes
force-window=immediate
window-maximized=no
keepaspect-window=yes
auto-window-resize=yes
osc=yes
input-builtin-dragging=yes

# Protocol profiles apply to both audio and video streams.
[protocol.http]
hls-bitrate=max
cache=yes
cache-pause=no

[protocol.https]
profile=protocol.http

[protocol.ytdl]
profile=protocol.http
